lengthwise: 1

entities:
  - { id: DR-001, type: decision, title: Repository artifacts are authoritative, lifecycle: accepted, decision: "Git-tracked repository artifacts are the authoritative engineering truth." }
  - { id: DR-002, type: decision, title: Project Graph is derived, lifecycle: accepted, decision: "The Project Graph is rebuilt from authoritative repository artifacts." }
  - { id: DR-003, type: decision, title: Derived and operational state are separated, lifecycle: accepted, decision: "Derived graph/index state and operational workflow/runtime state are stored separately." }
  - { id: DR-004, type: decision, title: SQLite is the initial persistence technology, lifecycle: accepted, decision: "Use local SQLite for the derived graph index and initial operational state." }
  - { id: DR-005, type: decision, title: Workspace abstracts Git worktrees, lifecycle: accepted, decision: "Workspace is a first-class domain abstraction; Git worktrees are the initial implementation." }
  - { id: DR-006, type: decision, title: Agent runtimes are provider adapters, lifecycle: accepted, decision: "AI and human implementers participate through a provider abstraction." }
  - { id: DR-007, type: decision, title: Human approval occurs only at material decision boundaries, lifecycle: accepted, decision: "Deterministic checks precede human judgment; human gates are not required at every phase." }
  - { id: DR-008, type: decision, title: Architecture and traceability are Project Graph projections, lifecycle: accepted, decision: "Architecture Explorer, Execution DAG, and Traceability Explorer are projections of the same engineering model." }
  - { id: DR-009, type: decision, title: Implementation and engineering artifacts must converge, lifecycle: accepted, decision: "Implementation and governing artifacts must agree before completion." }
  - { id: DR-010, type: decision, title: Artifact location is flexible; artifact semantics are prescribed, lifecycle: accepted, decision: "Projects choose physical artifact locations through include/exclude rules while Lengthwise prescribes recognition and semantic contracts." }
  - { id: DR-011, type: decision, title: Use Typia for runtime validation and schema generation, lifecycle: accepted, decision: "TypeScript types are the canonical in-code domain model and Typia generates validation at untrusted boundaries." }
  - { id: DR-012, type: decision, title: Semantic type and storage representation are independent, lifecycle: accepted, decision: "Entity semantic type does not dictate YAML versus Markdown or require heavyweight standalone documents." }
  - { id: DR-013, type: decision, title: Entity lifecycle is type-specific; dynamic and runtime states are separate, lifecycle: accepted, decision: "Each entity type has appropriate lifecycle states; readiness, satisfaction, verification results, and runtime state are derived or operational." }
  - { id: DR-014, type: decision, title: Rigor is inherited policy; significance is intrinsic to the change, lifecycle: accepted, decision: "Rigor inherits from the nearest explicit policy scope while significance is explicit on the relevant change." }
  - id: DR-015
    type: decision
    title: Invalid saved artifacts coexist with the last successful graph
    lifecycle: accepted
    decision: "The workbench writes an explicit save before rebuilding; if the repository no longer builds, the saved artifact remains authoritative while navigation retains and clearly labels the last successfully built graph."
    relationships:
      - { type: governs, to: F-002 }
      - { type: governs, to: REQ-018 }
  - id: DR-016
    type: decision
    title: Workbench graph changes use a successful session baseline
    lifecycle: accepted
    decision: "Model-change feedback compares consecutive successful Project Graph builds in the current workbench session; failed builds do not advance the baseline."
    relationships:
      - { type: governs, to: F-002 }
      - { type: governs, to: REQ-020 }
      - { type: governs, to: NFR-011 }
  - id: DR-017
    type: decision
    title: Workbench artifact saves are explicit
    lifecycle: accepted
    decision: "Editing is non-authoritative until an explicit save; the UI shows dirty state and protects users from accidental discard."
    relationships:
      - { type: governs, to: F-002 }
      - { type: governs, to: REQ-017 }
  - id: DR-018
    type: decision
    title: Minimal Workbench is a browser client over shared services
    lifecycle: accepted
    decision: "Use a SvelteKit and CodeMirror 6 browser client launched by lw serve over a loopback HTTP boundary; reusable Lengthwise application services own graph, validation, artifact, and graph-change behavior."
    relationships:
      - { type: governs, to: F-002 }
      - { type: governs, to: NFR-008 }
      - { type: governs, to: NFR-009 }
  - id: DR-019
    type: decision
    title: Questions are durable engineering entities
    lifecycle: accepted
    decision: "Represent unresolved engineering questions as first-class Question entities with explicit blocking semantics; an answer becomes governing only after propagation into the appropriate authoritative engineering entity."
    relationships:
      - { type: governs, to: F-003 }
      - { type: governs, to: REQ-025 }
  - id: DR-020
    type: decision
    title: Verification results are Evidence entities
    lifecycle: accepted
    decision: "Represent verification results as first-class Evidence entities with stable identity, outcome, applicability context, provenance, and many-to-many support for Verification definitions."
    relationships:
      - { type: governs, to: F-003 }
      - { type: governs, to: REQ-033 }
  - id: DR-021
    type: decision
    title: Accepted Build Contracts are authoritative handoff entities
    lifecycle: accepted
    decision: "Generate Build Contract candidates deterministically from the Project Graph and persist accepted contracts as first-class authoritative BuildContract entities with sufficient context identity to derive staleness."
    relationships:
      - { type: governs, to: F-003 }
      - { type: governs, to: REQ-030 }
      - { type: governs, to: REQ-031 }
  - id: DR-022
    type: decision
    title: Workflow approvals are operational events
    lifecycle: accepted
    decision: "Store gate approvals as operational events whose durable engineering effect is an authoritative lifecycle transition or artifact change; F-003 adds no Approval entity."
    relationships:
      - { type: governs, to: F-003 }
      - { type: governs, to: REQ-028 }
      - { type: governs, to: REQ-032 }
  - id: DR-023
    type: decision
    title: Workflow runtime uses a separate operational SQLite store
    lifecycle: accepted
    decision: "Store resumable workflow runtime and history in .lengthwise/state.db, separate from the disposable .lengthwise/index.db and authoritative Git artifacts."
    relationships:
      - { type: governs, to: F-003 }
      - { type: governs, to: REQ-023 }
      - { type: governs, to: NFR-013 }
  - id: DR-024
    type: decision
    title: Completeness remains lifecycle and rigor aware
    lifecycle: accepted
    decision: "Structural checks always apply; completeness obligations derive from entity type, lifecycle, and effective rigor rather than workflow phase."
    relationships:
      - { type: governs, to: F-003 }
      - { type: governs, to: REQ-026 }
  - id: DR-025
    type: decision
    title: Basic rigor inheritance follows graph parentage
    lifecycle: accepted
    decision: "Effective rigor resolves from the nearest explicit override, otherwise the parent scope, otherwise project default; F-003 adds no release-phase or subsystem conditional policy rules."
    relationships:
      - { type: governs, to: F-003 }
      - { type: governs, to: REQ-027 }
      - { type: governs, to: NFR-017 }
  - id: DR-026
    type: decision
    title: One active workflow run per feature
    lifecycle: accepted
    decision: "Permit at most one non-terminal workflow run for a feature while retaining terminal run history operationally."
    relationships:
      - { type: governs, to: F-003 }
      - { type: governs, to: REQ-021 }
  - id: DR-027
    type: decision
    title: Completion approval is rigor controlled
    lifecycle: accepted
    decision: "Derive completion eligibility deterministically and require a final human verification or completion gate only when effective rigor policy requires it."
    relationships:
      - { type: governs, to: F-003 }
      - { type: governs, to: REQ-036 }
